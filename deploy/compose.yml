# Deployed by Dokploy as a *Docker Compose* application, not as an
# "Application". Dokploy runs Docker Swarm, whose scheduler thinks in replicas,
# and SQLite admits exactly one writer: Compose keeps this single-instance by
# construction rather than by convention.
#
# Every value below comes from Dokploy's environment panel. Nothing secret is
# ever written here — this repository is public.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Published on the host loopback only, never on the public interface. This
    # is the far end of `ssh -L 8090:localhost:8090`: it is how the admin
    # console is reached now that Traefik refuses to route it.
    ports:
      - '127.0.0.1:8090:8090'
    environment:
      # The password-reset template builds its link from {APP_URL}. Left unset,
      # the mail sends users to localhost. APP_DOMAIN is the same host without
      # the scheme, because Traefik matches on the bare Host header.
      APP_URL: ${APP_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

      # Litestream reads the two key variables itself; the URL is passed to it
      # by the entrypoint.
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}

    volumes:
      # A named volume, not a bind mount: Dokploy clears absolute host paths on
      # every deployment, which would take the database with it on the second
      # deploy rather than the first — the kind of defect that only appears once
      # there is something to lose.
      - pb_data:/pb/pb_data

    # Both of these are required, and neither is optional scenery. A Compose
    # deployment does not get Traefik labels injected the way Dokploy's
    # "Application" type does: the router is declared here, and the container
    # has to sit on Traefik's own network for it to be reachable at all.
    # Without them Traefik answers every request with its default 404 — measured
    # on the first deploy, where the domain resolved, TLS terminated, and
    # nothing was routed.
    networks:
      - dokploy-network

    # Two paths are deliberately absent from the rule below, which is what
    # actually removes the admin console from the internet:
    #
    #   /_                            the console itself
    #   /api/collections/_superusers/ the door it knocks on
    #
    # Blocking only the first would have hidden the page while leaving the
    # password endpoint public — the console is a page, that endpoint is the
    # door, and an attacker who knows the API never visits the page. The SPA
    # touches neither, so nothing user-facing changes.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.budget-app.rule=Host(`${APP_DOMAIN}`) && !PathPrefix(`/_`) && !PathPrefix(`/api/collections/_superusers/`)'
      - 'traefik.http.routers.budget-app.entrypoints=web'
      # No HTTP-to-HTTPS middleware here on purpose. Naming one that does not
      # exist puts the router in error and drops plain HTTP to a 404 — which
      # breaks the ACME challenge and, behind a proxy that talks to the origin
      # in the clear, breaks the site. The redirect belongs to whatever sits in
      # front, or to Traefik's global configuration.
      - 'traefik.http.routers.budget-app-secure.rule=Host(`${APP_DOMAIN}`) && !PathPrefix(`/_`) && !PathPrefix(`/api/collections/_superusers/`)'
      - 'traefik.http.routers.budget-app-secure.entrypoints=websecure'
      - 'traefik.http.routers.budget-app-secure.tls.certResolver=letsencrypt'
      - 'traefik.http.services.budget-app.loadbalancer.server.port=8090'

networks:
  dokploy-network:
    external: true

volumes:
  pb_data:
